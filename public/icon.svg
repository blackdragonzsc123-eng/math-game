<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Neural circuits pattern -->
  <circle cx="120" cy="140" r="8" fill="#a5b4fc" opacity="0.6" />
  <circle cx="392" cy="140" r="8" fill="#67e8f9" opacity="0.6" />
  <circle cx="90" cy="320" r="8" fill="#c084fc" opacity="0.6" />
  <circle cx="420" cy="320" r="8" fill="#a5b4fc" opacity="0.6" />
  
  <path d="M120 140 L180 180 M392 140 L332 180 M90 320 L160 300 M420 320 L350 300" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" opacity="0.4" />
  
  <!-- Stylized Brain Icon -->
  <g filter="url(#glow)" fill="none" stroke="url(#brain)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M256 160 C230 110 150 110 130 160 C110 200 130 250 120 280 C110 320 130 360 170 380 C200 395 240 380 256 350" />
    <path d="M180 210 C160 230 160 270 190 280" />
    <path d="M220 170 C190 200 200 240 230 250" />
    <path d="M160 330 C190 320 210 340 230 330" />
    
    <!-- Right Hemisphere -->
    <path d="M256 160 C282 110 362 110 382 160 C402 200 382 250 392 280 C402 320 382 360 342 380 C312 395 272 380 256 350" />
    <path d="M332 210 C352 230 352 270 322 280" />
    <path d="M292 170 C322 200 312 240 282 250" />
    <path d="M352 330 C322 320 302 340 282 330" />
  </g>
  
  <!-- Central Spark / Energy Pulse -->
  <circle cx="256" cy="256" r="16" fill="#fbbf24" />
  <circle cx="256" cy="256" r="28" fill="#fbbf24" opacity="0.3" />
</svg>
